name: daily-pipeline

on:
  schedule:
    # UTC 10:30 = 北京时间 18:30（周一至五）；GitHub 定时触发可能有数分钟~半小时延迟
    - cron: '30 10 * * 1-5'
  workflow_dispatch:   # 手动首跑 / 补跑 / K线回填入口（Actions 页面右上角 Run workflow）
    inputs:
      kline_backfill:
        description: '全市场K线历史回填（首次/补历史时勾选，约 15 分钟）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Shanghai          # 进程时区对齐北京
      SENT_SITE_DIR: /tmp/sent-site   # 绕开 Windows 硬编码发布目录（Linux 无 C:\）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 每日抓取入档（非交易日 / 已在档自动幂等退出）
        run: |
          node fetch-daily.js 2>&1 | tee /tmp/fetch.log
          exit ${PIPESTATUS[0]}

      - name: 幂等门控（假日 / 已入档 → 跳过构建与发布，不空转）
        id: gate
        run: |
          if grep -qE "已在存档|无新交易日" /tmp/fetch.log; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 重建产物（含 kline 分片拷贝）
        if: steps.gate.outputs.updated == 'true' || inputs.kline_backfill == true
        run: node build.js

      - name: 全市场K线增量（追加当日 bar，停牌自动跳过）
        if: steps.gate.outputs.updated == 'true'
        run: node fetch-kline-all.js

      - name: 全市场K线历史回填（仅手动勾选时执行）
        if: inputs.kline_backfill == true
        run: node fetch-kline-all.js --init

      - name: 提交 data.json + kline 回仓库（数据持久化，永不丢失）
        if: steps.gate.outputs.updated == 'true' || inputs.kline_backfill == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "pipeline: $(date +'%F') 数据更新" && git push)

      - name: 配置 Pages
        if: steps.gate.outputs.updated == 'true' || inputs.kline_backfill == true
        uses: actions/configure-pages@v5

      - name: 上传产物
        if: steps.gate.outputs.updated == 'true' || inputs.kline_backfill == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        if: steps.gate.outputs.updated == 'true' || inputs.kline_backfill == true
        uses: actions/deploy-pages@v4
